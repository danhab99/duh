# Every push to main and every pull request: `nix flake check` on that exact
# commit, fetched by Nix from GitHub (no checkout). It runs the tests,
# demo.sh, and a start of the packaged app.

name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: write    # prune old Nix store caches

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Make room for the Nix store
        uses: wimpysworld/nothing-but-nix@v12

      - name: Install Nix
        uses: cachix/install-nix-action@v32
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}

      - name: Restore the Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-check-${{ runner.os }}-${{ github.sha }}
          restore-prefixes-first-match: nix-check-${{ runner.os }}-
          gc-max-store-size-linux: 12G
          purge: true
          purge-prefixes: nix-check-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Check
        run: nix flake check "github:${{ github.repository }}/${{ github.event.pull_request.head.sha || github.sha }}" --print-build-logs
