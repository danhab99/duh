name: duh_studio
description: "duh Studio: the desktop app for duh."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-400.ttf
          weight: 400
        - asset: fonts/Inter-500.ttf
          weight: 500
        - asset: fonts/Inter-600.ttf
          weight: 600
        - asset: fonts/Inter-700.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: fonts/JetBrainsMono-400.ttf
          weight: 400
        - asset: fonts/JetBrainsMono-500.ttf
          weight: 500
