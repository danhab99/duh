[package]
name = "lib"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ahash = "0.8.12"
blake3 = "1.8.2"
diff = "0.1.13"
hex = "0.4.3"
rmp-serde = "1.3.0"
serde = { version = "1.0.204", features = ["derive"] }
sha2 = "0.10.8"
toml = "0.8.19"
tempfile = "3.25.0"
serde_bytes = "0.11.19"
gearhash = "0.1.3"
globwalk = "0.9.1"
virtual-fs = "0.701.0"
url = "2.5.8"
tokio = { version = "1", features = ["rt-multi-thread"] }
# opendal 0.52's FTP backend breaks with suppaftp >= 6.1 (TLS connector API
# change); pin until opendal is upgraded.
suppaftp = { version = "=6.0.7", default-features = false }
# Every opendal backend that behaves like a filesystem (object stores, file
# protocols, cloud drives; http for read-only clones; memory for tests).
# Databases and caches are deliberately left out: caches evict objects and
# databases cap value sizes, neither of which a repository can survive.
opendal = { version = "0.52.0", features = [
    "layers-blocking",
    "services-s3",
    "services-gcs",
    "services-azblob",
    "services-oss",
    "services-obs",
    "services-cos",
    "services-b2",
    "services-swift",
    "services-upyun",
    "services-supabase",
    "services-vercel-blob",
    "services-lakefs",
    "services-fs",
    "services-ftp",
    "services-sftp",
    "services-webdav",
    "services-webhdfs",
    "services-hdfs-native",
    "services-azfile",
    "services-azdls",
    "services-dbfs",
    "services-alluxio",
    "services-ipmfs",
    "services-gdrive",
    "services-onedrive",
    "services-dropbox",
    "services-pcloud",
    "services-koofr",
    "services-yandex-disk",
    "services-aliyun-drive",
    "services-seafile",
    "services-icloud",
    "services-http",
    "services-memory",
] }
